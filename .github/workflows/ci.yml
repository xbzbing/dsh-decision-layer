name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    # Pinned rather than `ubuntu-latest`: a silent image migration moves the
    # Node/npm baseline the tests sit on. Bump this line deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines declares >=20.11; hosted runners no longer offer
        # Node 20, so CI exercises the supported 22/24 line instead of the floor.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `lib/` is not committed (docs/adr/0012, docs/adr/0015), so `npm run check`
      # builds both halves (the host build's `tsc` pass is the host typecheck and
      # `build.mjs` type-checks the client), runs the tests, then `npm pack`s the
      # tarball and checks its layout — the same sequence a release runs.
      - name: Build both halves, typecheck, test, and check the tarball
        run: npm ci && npm run check
