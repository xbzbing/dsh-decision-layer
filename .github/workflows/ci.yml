name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (node ${{ matrix.node }})
    # Pinned rather than `ubuntu-latest`: a silent image migration moves the
    # Node/npm baseline the tests sit on. Bump this line deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # package.json engines declares >=20.11; hosted runners no longer offer
        # Node 20, so CI exercises the supported 22/24 line instead of the floor.
        node: ['22.x', '24.x']
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `lib/` is not committed (docs/adr/0012, docs/adr/0015), so both halves
      # are built here. `npm run check` = build + tests: the host build runs
      # `tsc` for declarations (that is the host typecheck) and `build.mjs`
      # type-checks the client before bundling it.
      - name: Build both halves, typecheck, and test
        run: npm ci && npm run check

      # The tarball layout is part of this plugin's contract (main/exports/files,
      # host modules, client bundle). Pack it from the same build and run the
      # release assertion, so a broken manifest fails in the PR instead of at
      # release time. One Node line is enough: the check is artifact-shaped.
      - name: Package assertions
        if: matrix.node == '24.x'
        run: |
          set -euo pipefail
          mkdir -p dist
          npm pack --pack-destination dist
          node scripts/assert-pack.mjs dist/*.tgz
