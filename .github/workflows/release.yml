name: release

# Release on a version bump (ADR-0014). A push to main that changes package.json
# runs the full gate; if the version in that manifest is new, the run tags the
# commit, publishes to npm through Trusted Publishing (OIDC), and opens a GitHub
# Release with the same tarball. A package.json change that leaves the version
# alone is a no-op: the tag, npm version, and Release already exist.
#
# Every step checks state first, so a partially completed release can be re-run:
# an already-published npm version is skipped, an existing tag is not recreated,
# and an existing Release is edited in place. npm publish sits after the tag and
# before the Release — it is the only irreversible step.
on:
  push:
    branches: [main]
    paths: [package.json]
  workflow_dispatch:

permissions:
  contents: write   # push the release tag, create / edit the Release
  id-token: write   # npm Trusted Publishing (OIDC) + provenance

# One release at a time; never cancel one halfway (npm publish is not
# transactional with the tag or Release that follows it).
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # No registry-url / NODE_AUTH_TOKEN on purpose: a .npmrc auth line would
      # make npm try token auth instead of the OIDC exchange. Trusted Publishing
      # needs npm >= 11.5.1, which the Node 24 image ships.
      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: npm version
        run: |
          set -euo pipefail
          V=$(npm --version)
          echo "npm $V"
          node -e "const [a,b]=process.argv[1].split('.').map(Number); if (a<11||(a===11&&b<5)) { console.error('npm >= 11.5.1 is required for Trusted Publishing'); process.exit(1); }" "$V"

      # Read what already happened for this version before spending a minute on a
      # gate that may not be needed. A hyphen in the version marks a prerelease:
      # it goes to GitHub only, never to npm.
      - id: state
        name: Release state
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          case "$V" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac
          git ls-remote --exit-code --tags origin "refs/tags/v$V" >/dev/null 2>&1 && echo "tag=done" >> "$GITHUB_OUTPUT" || true
          gh release view "v$V" >/dev/null 2>&1 && echo "gh=done" >> "$GITHUB_OUTPUT" || true
          if [ "${V#*-}" = "$V" ]; then
            npm view "dsh-decision-layer@$V" version >/dev/null 2>&1 && echo "npm=done" >> "$GITHUB_OUTPUT" || true
          else
            echo "npm=skipped" >> "$GITHUB_OUTPUT"
          fi

      # The release body ships with the release commit so it is reviewed like the
      # code, and a missing file fails BEFORE the irreversible npm step.
      - id: notes
        name: Release notes
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          FILE="docs/releases/v$V.md"
          if [ ! -f "$FILE" ]; then
            echo "::error::$FILE is missing — write it from docs/releases/README.md and commit it with the version bump"
            exit 1
          fi
          echo "file=$FILE" >> "$GITHUB_OUTPUT"

      # `lib/` is not committed, so the host tree and client bundle must be built
      # before packing; the gate is what turns "forgot to build" from a silent
      # broken release into a failed pipeline.
      - name: Gate (build + tests + pack + assert)
        if: steps.state.outputs.npm != 'done' || steps.state.outputs.tag != 'done' || steps.state.outputs.gh != 'done'
        run: |
          set -euo pipefail
          npm ci
          npm run check
          npm pack
          node scripts/assert-pack.mjs "dsh-decision-layer-$(node -p "require('./package.json').version").tgz"

      - name: Tag
        if: steps.state.outputs.tag != 'done'
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v$V" -m "v$V"
          git push origin "refs/tags/v$V"

      # Trusted Publishing: npm exchanges the workflow's OIDC token for a
      # short-lived publish credential. No NPM_TOKEN secret is involved.
      # Prereleases never reach this step.
      - name: Publish to npm
        if: steps.state.outputs.prerelease != 'true' && steps.state.outputs.npm != 'done'
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          npm publish "dsh-decision-layer-$V.tgz" --provenance --access public

      - name: GitHub Release
        if: steps.state.outputs.gh != 'done'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          V="${{ steps.state.outputs.version }}"
          if [ "${{ steps.state.outputs.prerelease }}" = "true" ]; then
            CHANNEL=(--prerelease)
          else
            CHANNEL=(--latest)
          fi
          if gh release view "v$V" >/dev/null 2>&1; then
            gh release edit "v$V" --title "v$V" --notes-file "${{ steps.notes.outputs.file }}" "${CHANNEL[@]}"
            # A previous run may have created the Release but failed before (or
            # while) uploading the asset; re-uploading makes the rerun idempotent.
            gh release upload "v$V" "dsh-decision-layer-$V.tgz" --clobber
          else
            gh release create "v$V" "dsh-decision-layer-$V.tgz" \
              --title "v$V" --notes-file "${{ steps.notes.outputs.file }}" --verify-tag "${CHANNEL[@]}"
          fi
